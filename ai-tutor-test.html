<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English Studio · AI Tutor Test</title><style>body{font:16px system-ui;background:#f7f1e9;color:#382d2a;max-width:680px;margin:30px auto;padding:16px}section{background:#fffdf9;border-radius:18px;padding:20px;margin:14px 0}input,textarea,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #dccbc5}input,textarea{width:100%;box-sizing:border-box;margin:7px 0}button{background:#855a66;color:white;cursor:pointer}.chat{white-space:pre-wrap;max-height:400px;overflow:auto}.error{color:#a32929}</style><h1>🌷 Lilly's AI Tutor</h1><p>AI tutor test · Your main studio remains unchanged.</p><section id="login"><h2>Sign in</h2><input type="email" id="email" placeholder="Supabase email"><input type="password" id="password" placeholder="Password"><button id="sign">Sign in</button><p id="authStatus"></p></section><section id="practice" hidden><h2>Let's talk</h2><p>Write in English. Your tutor will follow your ideas and help you improve.</p><div class="chat" id="chat"></div><textarea id="message" placeholder="What would you like to talk about?"></textarea><button id="send">Send</button> <button id="review">Review my English</button> <button id="logout">Sign out</button><p id="status"></p></section><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.57.0";
const client=createClient("https://vgkyoyosjewdygxtnqvu.supabase.co","sb_publishable_QOZiGlFdzOcCQtqDqI_I_A_ian2l-pf");
const $=id=>document.getElementById(id);let history=[];
function show(user){$("login").hidden=!!user;$("practice").hidden=!user;$("authStatus").textContent="";}
function bubble(role,content){const el=document.createElement("p");const b=document.createElement("strong");b.textContent=role==="user"?"You: ":"Tutor: ";el.append(b,document.createTextNode(content));$("chat").append(el);$("chat").scrollTop=$("chat").scrollHeight}
$("sign").onclick=async()=>{const{data,error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)$("authStatus").textContent=error.message;else show(data.user)};
$("logout").onclick=async()=>{await client.auth.signOut();history=[];$("chat").textContent="";show(null)};
async function ask(message){$("send").disabled=true;$("review").disabled=true;$("status").textContent="Thinking…";try{const{data,error}=await client.functions.invoke("les-english-tutor",{body:{message,history}});if(error)throw Error(data?.error||error.message);if(!data?.reply)throw Error(data?.error||"No reply");bubble("user",message);bubble("assistant",data.reply);history.push({role:"user",content:message},{role:"assistant",content:data.reply});history=history.slice(-12);$("message").value="";$("status").textContent=""}catch(e){$("status").textContent="Could not connect: "+e.message;$("status").className="error"}finally{$("send").disabled=false;$("review").disabled=false}}
$("send").onclick=()=>{const m=$("message").value.trim();if(m)ask(m)};
$("review").onclick=()=>ask("Please review my English in our conversation so far. Identify up to three important corrections and ask me to reformulate one sentence.");
const{data:{session}}=await client.auth.getSession();show(session?.user);
</script></html>
